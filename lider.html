<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Líder ejemplo operativo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;800;900&display=swap">
<style>
/* Layout: título grande a la izquierda, mapa orbital a la derecha. El líder al centro; 5 principios en pentágono que se encienden al tocarlos y se conectan al centro. Un solo look oscuro. */
:root{--bg:#0f3a20;--bg2:#1c5931;--yellow:#f1b542;--cream:#f2d091;--white:#fff;--font:'Montserrat',system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 90% at 75% 40%,var(--bg2),var(--bg) 70%);background-color:var(--bg);color:var(--white);font-family:var(--font);min-height:100vh;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:32px;align-items:center}
.txt .k{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--yellow);font-weight:800}
h1{margin:14px 0 0;font-weight:900;line-height:.95;font-size:clamp(40px,6.4vw,86px);letter-spacing:-.02em}
h1 em{display:block;font-style:normal;color:var(--yellow)}
.intro{margin:26px 0 0;max-width:480px;font-size:clamp(16px,1.7vw,20px);line-height:1.5;color:var(--cream);font-weight:500}
.prog{margin-top:28px;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--cream);font-weight:600}
.prog i{width:34px;height:6px;border-radius:3px;background:rgba(255,255,255,.18);transition:background .4s}
.prog i.on{background:var(--yellow)}
.stage{position:relative;width:64%;max-width:640px;margin:0 auto;aspect-ratio:1;container-type:inline-size}
.stage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.spin{transform-origin:300px 300px;animation:spin 90s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ln{stroke:rgba(242,208,145,.35);stroke-width:1.5;stroke-dasharray:4 7;transition:stroke .5s,stroke-width .5s}
.ln.on{stroke:var(--yellow);stroke-width:3;stroke-dasharray:none}
#ring{transition:stroke-dashoffset .8s cubic-bezier(.3,1,.4,1)}
.core{position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:linear-gradient(145deg,rgba(255,255,255,.2),rgba(255,255,255,.05));backdrop-filter:blur(10px);border:1.5px solid rgba(255,255,255,.35);box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 20px 40px -10px rgba(0,0,0,.5);transition:box-shadow .6s,background .6s}
.core b{font-size:6.4cqw;font-weight:900;line-height:1;letter-spacing:-.01em}
.core span{font-size:2.6cqw;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--yellow);margin-top:.8cqw}
.core.done{background:linear-gradient(145deg,var(--yellow),#d99a28);box-shadow:0 0 0 1.4cqw rgba(241,181,66,.22),0 0 60px rgba(241,181,66,.5)}
.core.done b{color:#14411f}.core.done span{color:#14411f}
.nd{pointer-events:none;position:absolute;width:36%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:2.2cqw;padding:1.8cqw 2.4cqw 1.8cqw 1.8cqw;border-radius:5cqw;cursor:pointer;text-align:left;color:var(--white);font:700 2.5cqw/1.2 var(--font);background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.06));backdrop-filter:blur(12px) saturate(1.4);border:1.5px solid rgba(255,255,255,.35);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),0 14px 26px -10px rgba(0,0,0,.55);transition:transform .35s cubic-bezier(.34,1.6,.5,1),background .35s,color .35s,border-color .35s,box-shadow .35s;opacity:0;animation:pop .7s cubic-bezier(.34,1.5,.5,1) forwards}
.nd:nth-of-type(1){animation-delay:.2s}.nd:nth-of-type(2){animation-delay:.4s}.nd:nth-of-type(3){animation-delay:.6s}.nd:nth-of-type(4){animation-delay:.8s}.nd:nth-of-type(5){animation-delay:1s}
@keyframes pop{from{opacity:0;transform:translate(-50%,-30%) scale(.8)}to{opacity:1;transform:translate(-50%,-50%)}}
.nd i{flex:0 0 6.6cqw;height:6.6cqw;border-radius:50%;background:var(--yellow);color:#14411f;display:grid;place-items:center;font-style:normal;font-weight:900;font-size:3.4cqw;transition:background .3s,color .3s}
.nd:hover,.nd:focus-visible{transform:translate(-50%,-56%);outline:none}
.nd.on{background:var(--yellow);color:#14411f;border-color:#fff;box-shadow:0 0 0 1cqw rgba(241,181,66,.25),0 18px 30px -10px rgba(0,0,0,.6)}
.nd.on i{background:#14411f;color:var(--yellow)}
.tip{margin-top:6px;text-align:center;font-size:13px;color:var(--cream);opacity:.75}
.txt{visibility:hidden}
@media (max-width:820px){.wrap{grid-template-columns:1fr}.txt{display:none}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.nd{animation:none;opacity:1;transform:translate(-50%,-50%)}}
</style></head><body>
<div class="wrap">
 <div class="txt">
  <div class="k">Liderazgo operativo</div>
  <h1>El líder como <em>ejemplo operativo</em></h1>
  <p class="intro">Un líder no solo supervisa el trabajo; también participa, acompaña y demuestra con el ejemplo cómo deben hacerse las cosas.</p>
  <div class="prog" id="prog" hidden><i></i><i></i><i></i><i></i><i></i><span id="pc">0 de 5</span></div>
 </div>
 <div>
  <div class="stage" id="st">
   <svg viewBox="0 0 600 600" aria-hidden="true">
    <g class="spin">
     <circle cx="300" cy="300" r="250" fill="none" stroke="rgba(242,208,145,.25)" stroke-width="1.5" stroke-dasharray="2 10"/>
     <circle cx="300" cy="300" r="268" fill="none" stroke="rgba(242,208,145,.12)" stroke-width="1"/>
    </g>
    <g id="lines"></g>
    <circle cx="300" cy="300" r="112" fill="none" stroke="rgba(255,255,255,.14)" stroke-width="8"/>
    <circle id="ring" cx="300" cy="300" r="112" fill="none" stroke="#f1b542" stroke-width="8" stroke-linecap="round" transform="rotate(-90 300 300)" stroke-dasharray="703.7" stroke-dashoffset="703.7"/>
   </svg>
   <div class="core" id="core"></div>
   <button class="nd" style="left:50%;top:14%"><i>1</i>Cumple procedimientos</button>
   <button class="nd" style="left:84%;top:39%"><i>2</i>Respeta estándares</button>
   <button class="nd" style="left:71%;top:78%"><i>3</i>Cuida detalles.</button>
   <button class="nd" style="left:29%;top:78%"><i>4</i>Mantiene orden y organización.</button>
   <button class="nd" style="left:16%;top:39%"><i>5</i>Actúa con coherencia.</button>
  </div>
 </div>
</div>
<script>
(function(){
var P=[[300,84],[504,234],[426,468],[174,468],[96,234]],L=document.getElementById('lines'),ln=[];
P.forEach(function(p){var l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',300);l.setAttribute('y1',300);l.setAttribute('x2',p[0]);l.setAttribute('y2',p[1]);l.setAttribute('class','ln');L.appendChild(l);ln.push(l);});
var nd=document.querySelectorAll('.nd'),ps=document.querySelectorAll('#prog i'),ring=document.getElementById('ring'),core=document.getElementById('core'),pc=document.getElementById('pc'),st={};
function upd(){var n=Object.keys(st).filter(function(k){return st[k];}).length;
 ring.style.strokeDashoffset=703.7*(1-n/5);pc.textContent=n+' de 5';
 ps.forEach(function(p,i){p.classList.toggle('on',i<n);});core.classList.toggle('done',n===5);}
function set(i,v){st[i]=v;nd[i].classList.toggle('on',v);ln[i].classList.toggle('on',v);upd();}
function cycle(){var k=0;(function step(){if(k<5){set(k,true);k++;setTimeout(step,900);}else{setTimeout(function(){for(var q=0;q<5;q++)set(q,false);setTimeout(cycle,1200);},3200);}})();}
setTimeout(cycle,1500);
})();
</script>
</body></html>
