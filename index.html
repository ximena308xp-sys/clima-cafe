/* Concepto: escena 16:9 de plantación cafetera en ilustración plana (estilo personajes Sweet & Coffee).
   Cámara con zoom por capas al elegir un factor climático; una sola pantalla, sin scroll. */
:root{
  --green:#0B5D3F; --green-deep:#084A32; --ink:#06261A; --gold:#D6AD65; --cream:#FFF6E3; --coral:#F0795A; --sun:#FFD36B;
  --body:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* Backline va incrustada en el @font-face de arriba; Montserrat cubre los caracteres que Backline no tiene (por ejemplo ≈). */
  --display:"Backline","Montserrat",system-ui,sans-serif;
  --dur:.95s; --ease:cubic-bezier(.65,0,.35,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#0A3A28;color:#fff;font-family:var(--body)}
.viewport{position:fixed;inset:0;overflow:hidden;background:#0A3A28}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;overflow:hidden;background:#CDE9E3;user-select:none;-webkit-user-select:none}
.layer{position:absolute;inset:0;transform-origin:0 0;transition:transform var(--dur) var(--ease);pointer-events:none;will-change:transform}
.par{position:absolute;inset:0;transform-origin:50% 50%;will-change:transform}
.par svg,.par img{position:absolute;inset:0;width:100%;height:100%;display:block}
.par img{object-fit:cover;pointer-events:none}

/* Título */
.intro{position:absolute;left:80px;top:60px;width:max-content;max-width:800px;padding:34px 56px 36px;border-radius:40px;background:var(--green);border:2px solid rgba(214,173,101,.7);box-shadow:0 18px 0 -6px rgba(6,38,26,.25);z-index:11;transition:opacity .5s,transform .7s var(--ease);pointer-events:none}
.intro h1{margin:0;max-width:640px;font-family:var(--body);font-weight:800;font-size:54px;line-height:1.1;color:#fff;text-wrap:balance}
.intro p{margin:16px 0 0;font-weight:600;font-size:24px;color:var(--gold)}
.stage.active .intro{opacity:0;transform:translateY(-24px)}

/* Hotspots */
.hs{position:absolute;width:0;height:0;transition:opacity .45s,visibility 0s}
.stage.active .hs{opacity:0;visibility:hidden;transition:opacity .45s,visibility 0s .45s}
.hs button{position:absolute;left:-130px;top:-50px;width:260px;height:170px;background:none;border:0;padding:0;cursor:pointer;pointer-events:auto;font:inherit;color:inherit;border-radius:24px}
.hs .ring,.hs .mid,.hs .dot{position:absolute;left:50%;top:50px;border-radius:50%;transform:translate(-50%,-50%)}
.hs .ring{width:104px;height:104px;border:3px solid rgba(255,255,255,.85);background:rgba(255,255,255,.16)}
.hs .pulse{position:absolute;left:50%;top:50px;width:104px;height:104px;margin:-52px 0 0 -52px;border-radius:50%;border:3px solid var(--gold);animation:pulse 2.2s ease-out infinite}
.hs .mid{width:70px;height:70px;background:rgba(214,173,101,.5)}
.hs .dot{width:30px;height:30px;background:var(--gold);border:4px solid #fff;transition:transform .25s}
.hs .lab{position:absolute;left:50%;top:118px;transform:translateX(-50%);white-space:nowrap;background:var(--green);border:2px solid var(--gold);color:#fff;font-weight:600;font-size:24px;padding:9px 22px;border-radius:999px;transition:background .25s,color .25s,transform .25s}
.hs button:hover .dot,.hs button:focus-visible .dot{transform:translate(-50%,-50%) scale(1.3)}
.hs button:hover .lab,.hs button:focus-visible .lab{background:var(--gold);color:var(--green-deep);transform:translateX(-50%) translateY(-3px)}
.hs button:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
@keyframes pulse{0%{transform:scale(.55);opacity:.95}100%{transform:scale(1.5);opacity:0}}

/* Efectos */
.fx{position:absolute;inset:0;z-index:10;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .7s,visibility 0s .7s}
.fx.on{opacity:1;visibility:visible;transition:opacity .9s .5s,visibility 0s}
.fx svg{position:absolute;inset:0;width:100%;height:100%}
.wave{animation:rise 3.2s ease-in-out infinite}
@keyframes rise{0%{transform:translateY(24px);opacity:0}30%{opacity:1}100%{transform:translateY(-34px);opacity:0}}
.drop{animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,-30px);opacity:0}12%{opacity:1}85%{opacity:.9}100%{transform:translate(-26px,150px);opacity:0}}
.streak{stroke-dasharray:200 80 120 70;animation:flow 2.6s linear infinite}
@keyframes flow{to{stroke-dashoffset:-470}}
.lf{animation:blow 5s linear infinite}
@keyframes blow{0%{transform:translate(-80px,10px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translate(520px,-50px) rotate(280deg);opacity:0}}
.ct{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ping{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}

/* Tarjeta */
.card{position:absolute;z-index:12;top:50%;width:640px;margin-top:-34px;padding:52px;border-radius:44px;background:var(--green);border:2px solid rgba(214,173,101,.7);box-shadow:0 26px 0 -8px rgba(6,38,26,.22),0 30px 70px rgba(0,30,15,.4);opacity:0;visibility:hidden;transform:translate(var(--dx),-50%);transition:opacity .45s,transform .7s var(--ease),visibility 0s .7s}
.card.L{left:100px;--dx:-60px}.card.R{left:1180px;--dx:60px}
.card.on{opacity:1;visibility:visible;transform:translate(0,-50%);transition:opacity .6s .55s,transform .85s .55s var(--ease),visibility 0s .55s}
.card>*{opacity:0}
.card.on>*{animation:up .6s var(--ease) forwards}
.card.on>*:nth-child(2){animation-delay:.75s}.card.on>*:nth-child(3){animation-delay:.85s}.card.on>*:nth-child(4){animation-delay:.95s}.card.on>*:nth-child(5){animation-delay:1.05s}.card.on>*:nth-child(6){animation-delay:1.15s}.card.on>*:nth-child(1){animation-delay:.65s}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.eyebrow{margin:0 0 14px;font-weight:700;font-size:18px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.card h2{margin:0 0 22px;font-family:var(--display);font-weight:800;font-size:60px;line-height:1.05;color:#fff;text-wrap:balance}
.card h2.sm{font-size:50px}
.rule{width:72px;height:6px;border-radius:3px;background:var(--gold);margin:22px 0}
.card p.txt{margin:0 0 28px;font-size:23px;line-height:1.55;color:rgba(255,255,255,.93);font-weight:500}
.vis{position:relative;height:228px}
.close{position:absolute;right:40px;top:36px;width:64px;height:64px;border-radius:50%;border:0;background:var(--gold);cursor:pointer;display:grid;place-items:center;transition:transform .25s,background .25s;opacity:1!important}
.card.on>.close{animation:none}
.close:hover{transform:rotate(90deg) scale(1.06);background:#E6C27F}
.close:focus-visible,.nav button:focus-visible{outline:4px solid var(--sun);outline-offset:3px}

/* Visuales de tarjeta */
.vt{display:flex;gap:26px;align-items:flex-start}
.vt .tt{padding-top:4px}
.big{margin:0;font-family:var(--display);font-weight:800;font-size:62px;line-height:1;color:var(--gold)}
.cap{margin:6px 0 0;font-size:20px;color:rgba(255,255,255,.85);font-weight:500}
.risk{margin:20px 0 0;font-weight:700;font-size:34px;line-height:1;color:var(--coral)}
.merc{transform-origin:48px 192px;transform:scaleY(0)}
.card.on .merc{animation:mercury 1.5s 1s cubic-bezier(.3,.8,.3,1) forwards}
@keyframes mercury{to{transform:scaleY(1)}}
.pk{transform-origin:0 220px;transform:scaleY(.15)}
.card.on .pk{animation:grow 1.1s cubic-bezier(.3,.8,.3,1) forwards}
.card.on .pk.p2{animation-delay:.2s}.card.on .pk.p3{animation-delay:.4s}
@keyframes grow{to{transform:scaleY(1)}}
.arr{stroke-dasharray:1;stroke-dashoffset:1}
.card.on .arr{animation:draw 1.2s 1.2s ease forwards}
.cdrop{animation:cfall 1.8s ease-in infinite}
@keyframes cfall{0%{transform:translateY(-6px);opacity:0}25%{opacity:1}100%{transform:translateY(34px);opacity:0}}
.mk{transform:translateX(-250px)}
.card.on .mk{animation:slide 1.6s 1s cubic-bezier(.3,.8,.3,1) forwards}
@keyframes slide{to{transform:translateX(0)}}
.wl{stroke-dasharray:150 60;animation:flow 2.4s linear infinite}
.plant{transform-origin:500px 150px;animation:sway 2.8s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(7deg)}}
.chips{display:flex;gap:12px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.13);border-radius:999px;padding:9px 18px 9px 14px;font-weight:600;font-size:19px}
.chip i{width:14px;height:14px;border-radius:50%;display:block}
.lbls{display:flex;justify-content:space-between;font-size:18px;font-weight:600;color:rgba(255,255,255,.85);margin-top:8px}
.lbls b{color:var(--gold);font-weight:700}

/* Navegación */
.nav{position:absolute;z-index:13;left:50%;bottom:48px;transform:translate(-50%,40px);display:flex;gap:8px;padding:10px;border-radius:999px;background:rgba(6,38,26,.82);border:2px solid rgba(214,173,101,.55);box-shadow:0 12px 30px rgba(0,30,15,.4);opacity:0;visibility:hidden;transition:opacity .4s,transform .6s var(--ease),visibility 0s .6s}
.stage.active .nav{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .5s .7s,transform .7s .7s var(--ease),visibility 0s .7s}
.nav button{border:0;background:none;color:rgba(255,255,255,.85);font:600 22px var(--body);padding:11px 26px;border-radius:999px;cursor:pointer;transition:background .25s,color .25s}
.nav button:hover{background:rgba(255,255,255,.12);color:#fff}
.nav button[aria-current="true"]{background:var(--gold);color:var(--green-deep)}

@media (prefers-reduced-motion:reduce){
  :root{--dur:.01s}
  *,*::before,*::after{animation-duration:.01s!important;animation-iteration-count:1!important;transition-duration:.01s!important;transition-delay:0s!important}
  .card>*{opacity:1}
}

  var o=document.createElement('div');o.className='layer';o.dataset.id=L.id;
  var p=document.createElement('div');p.className='par';p.innerHTML=L.svg;o.appendChild(p);layersEl.appendChild(o);
  pars[L.id]=p;outers[L.id]=o;
});
function clamp(v,a,b){return Math.min(b,Math.max(a,v));}
FACTORS.forEach(function(F){
  var hs=document.createElement('div');hs.className='hs';hs.style.left=F.P[0]+'px';hs.style.top=F.P[1]+'px';
  hs.innerHTML='<button type="button" aria-label="'+F.label+'"><span class="pulse"></span><span class="ring"></span><span class="mid"></span><span class="dot"></span><span class="lab">'+F.label+'</span></button>';
  hs.firstChild.addEventListener('click',function(){open(F.k);});
  pars[F.layer].appendChild(hs);
  outers[F.layer].style.pointerEvents='none';
});

/* ---------- cámara ---------- */
var LF={};LAYERS.forEach(function(L){LF[L.id]=L;});
function cam(F){var out={};LAYERS.forEach(function(L){var f=F.f;out[L.id]={f:f,x:clamp(F.T[0]-f*F.P[0],W-W*f,0),y:clamp(F.T[1]-f*F.P[1],H-H*f,0)};});return out;}
function sp(c,id,x,y){var q=c[id];return {x:q.x+q.f*x,y:q.y+q.f*y};}

/* ---------- efectos por factor ---------- */
var fxsEl=document.getElementById('fxs'),fxEls={};
function S(b){return '<svg viewBox="0 0 1920 1080" aria-hidden="true">'+b+'</svg>';}
function fxHTML(F,c){
  var i,h='';
  if(F.k==='temp'){var s=sp(c,'bg',1686,255);
    h+='<circle cx="'+s.x+'" cy="'+s.y+'" r="520" fill="#FFB347" opacity=".12"/><circle cx="'+s.x+'" cy="'+s.y+'" r="380" fill="#FFB347" opacity=".14"/><circle cx="'+s.x+'" cy="'+s.y+'" r="250" fill="#FFB347" opacity=".18"/>';
    for(i=0;i<7;i++){var x=s.x-330+i*110,y0=s.y+330;h+='<g class="wave" style="animation-delay:'+(i*.45)+'s"><path d="M'+x+' '+y0+'C'+(x+26)+' '+(y0-60)+' '+(x-26)+' '+(y0-120)+' '+x+' '+(y0-180)+'S'+(x+26)+' '+(y0-300)+' '+x+' '+(y0-360)+'" stroke="#fff" stroke-opacity=".6" stroke-width="4" stroke-linecap="round" fill="none"/></g>';}
  }
  if(F.k==='alt'){var a=sp(c,'bg',1160,415);
    for(i=0;i<7;i++)h+='<ellipse class="ct" pathLength="1" style="animation-delay:'+(.7+i*.15)+'s" cx="'+a.x+'" cy="'+(a.y+50)+'" rx="'+(90+i*74)+'" ry="'+(44+i*38)+'" transform="rotate(-8 '+a.x+' '+(a.y+50)+')" stroke="#fff" stroke-opacity="'+(.75-i*.08).toFixed(2)+'" stroke-width="2.5" fill="none"/>';
    h+='<path class="ct" pathLength="1" style="animation-delay:1s" d="M120 900V190M120 190l-16 22M120 190l16 22" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>';
    for(var y=860;y>=220;y-=80)h+='<path d="M104 '+y+'h32" stroke="#fff" stroke-opacity=".85" stroke-width="3" stroke-linecap="round"/>';
    h+='<circle class="ping" cx="'+a.x+'" cy="'+(a.y+50)+'" r="22" fill="none" stroke="#D6AD65" stroke-width="4"/><circle cx="'+a.x+'" cy="'+(a.y+50)+'" r="9" fill="#D6AD65"/>';
  }
  if(F.k==='lluvia'){var q=sp(c,'bg',880,320);
    for(i=0;i<90;i++){var dx=q.x-260+rnd()*520,dy=q.y+40+rnd()*300,len=34+rnd()*34;h+='<g class="drop" style="animation-duration:'+(1+rnd()*.9).toFixed(2)+'s;animation-delay:-'+(rnd()*2).toFixed(2)+'s"><path d="M'+dx.toFixed(0)+' '+dy.toFixed(0)+'l'+(-len*.22).toFixed(0)+' '+len.toFixed(0)+'" stroke="#EAF7FF" stroke-opacity="'+(.45+rnd()*.5).toFixed(2)+'" stroke-width="'+(2.4+rnd()*1.4).toFixed(1)+'" stroke-linecap="round"/></g>';}
  }
  if(F.k==='viento'){var w=sp(c,'bg',1500,690);
    for(i=0;i<8;i++){var yy=w.y-230+i*58;h+='<path class="streak" style="animation-delay:-'+(i*.45).toFixed(2)+'s" d="M'+(w.x-250)+' '+yy+'C'+(w.x-80)+' '+(yy-60)+' '+(w.x+70)+' '+(yy+60)+' '+(w.x+250)+' '+yy+'S'+(w.x+570)+' '+(yy-50)+' '+(w.x+780)+' '+(yy+10)+'" stroke="#fff" stroke-opacity="'+(.85-i*.06).toFixed(2)+'" stroke-width="4.5" stroke-linecap="round" fill="none"/>';}
    for(i=0;i<9;i++){var lx=w.x-200+rnd()*600,ly=w.y-210+rnd()*400;h+='<g transform="translate('+lx.toFixed(0)+' '+ly.toFixed(0)+')"><g class="lf" style="animation-delay:-'+(rnd()*5).toFixed(2)+'s"><path d="M0 0C10 -13 30 -13 40 0Z" fill="#46B677"/><path d="M0 0C10 13 30 13 40 0Z" fill="#1E9A68"/></g></g>';}
  }
  return S(h);
}

/* ---------- tarjetas ---------- */
var cardsEl=document.getElementById('cards'),cardEls={},navEl=document.getElementById('nav'),navBtns={};
var CX='<svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="#0B5D3F" stroke-width="3" stroke-linecap="round"/></svg>';
var camCache={};
FACTORS.forEach(function(F){
  camCache[F.k]=cam(F);
  var fx=document.createElement('div');fx.className='fx';fx.innerHTML=fxHTML(F,camCache[F.k]);fxsEl.appendChild(fx);fxEls[F.k]=fx;
  var c=document.createElement('section');c.className='card '+F.side;c.setAttribute('aria-label',F.title);
  c.innerHTML='<p class="eyebrow">'+F.n+' · Factor climático</p><h2'+(F.sm?' class="sm"':'')+'>'+F.title+'</h2><p class="txt">'+F.txt+'</p>'+F.vis+'<button class="close" type="button" aria-label="Cerrar y volver al paisaje">'+CX+'</button>';
  c.querySelector('.close').addEventListener('click',close);
  cardsEl.appendChild(c);cardEls[F.k]=c;
  var b=document.createElement('button');b.type='button';b.textContent=F.nav;b.addEventListener('click',function(){open(F.k);});navEl.appendChild(b);navBtns[F.k]=b;
});

/* ---------- estado ---------- */
var cur=null,mx=0,my=0,pcx={},tgtScale=1.06;
function applyCam(c){LAYERS.forEach(function(L){var q=c?c[L.id]:{f:1,x:0,y:0};outers[L.id].style.transform='translate('+q.x+'px,'+q.y+'px) scale('+q.f+')';});}
function open(k){
  var prev=cur;cur=k;stage.classList.add('active');
  applyCam(camCache[k]);
  var FF=FACTORS.filter(function(f){return f.k===k;})[0];
  if(prev!==k)fxEls[k].innerHTML=fxHTML(FF,camCache[k]);
  Object.keys(fxEls).forEach(function(x){fxEls[x].classList.toggle('on',x===k);});
  Object.keys(cardEls).forEach(function(x){if(x!==k)cardEls[x].classList.remove('on');});
  Object.keys(navBtns).forEach(function(x){if(x===k)navBtns[x].setAttribute('aria-current','true');else navBtns[x].removeAttribute('aria-current');});
  var el=cardEls[k];
  if(prev&&prev!==k){el.classList.remove('on');void el.offsetWidth;}
  el.classList.add('on');
  setTimeout(function(){var cb=el.querySelector('.close');if(cb&&cur===k)cb.focus({preventScroll:true});},reduce?20:1500);
}
function close(){
  var k=cur;cur=null;stage.classList.remove('active');applyCam(null);
  Object.keys(fxEls).forEach(function(x){fxEls[x].classList.remove('on');});
  Object.keys(cardEls).forEach(function(x){cardEls[x].classList.remove('on');});
  Object.keys(navBtns).forEach(function(x){navBtns[x].removeAttribute('aria-current');});
  setTimeout(function(){if(!cur&&k){var b=document.querySelector('.hs button[aria-label="'+FACTORS.filter(function(f){return f.k===k;})[0].label+'"]');if(b)b.focus({preventScroll:true});}},reduce?20:900);
}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&cur){close();}
  if(cur&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){var i=FACTORS.map(function(f){return f.k;}).indexOf(cur);i=(i+(e.key==='ArrowRight'?1:FACTORS.length-1))%FACTORS.length;open(FACTORS[i].k);}
});

/* ---------- parallax con el cursor (reposo) ---------- */
window.addEventListener('pointermove',function(e){if(e.pointerType==='touch')return;mx=(e.clientX/window.innerWidth-.5)*2;my=(e.clientY/window.innerHeight-.5)*2;});
LAYERS.forEach(function(L){pcx[L.id]={x:0,y:0,s:1.06};pars[L.id].style.transform='translate(0px,0px) scale(1.06)';});
function tick(){
  var act=!!cur;
  LAYERS.forEach(function(L){
    var q=pcx[L.id],tx=act?0:-mx*L.m,ty=act?0:-my*L.m*.6,ts=act?1:1.06,k=reduce?1:.07;
    q.x+=(tx-q.x)*k;q.y+=(ty-q.y)*k;q.s+=(ts-q.s)*k;
    pars[L.id].style.transform='translate('+q.x.toFixed(2)+'px,'+q.y.toFixed(2)+'px) scale('+q.s.toFixed(4)+')';
  });
  requestAnimationFrame(tick);
}
if(!reduce)requestAnimationFrame(tick);else{LAYERS.forEach(function(L){pars[L.id].style.transform='none';});}
})();
</script>
