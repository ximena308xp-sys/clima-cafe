  if(hasF){g.filter='blur('+r+'px)';g.drawImage(im,pad,pad)}
  else{var k=1/(1+r*.55),t=document.createElement('canvas');t.width=Math.max(2,Math.round(w*k));t.height=Math.max(2,Math.round(h*k));var tg=t.getContext('2d');tg.imageSmoothingQuality='high';tg.drawImage(im,pad*k,pad*k,im.width*k,im.height*k);g.imageSmoothingQuality='high';g.drawImage(t,0,0,w,h)}
  return CACHE[i][li]={c:c,pad:pad};
}

/* ---- escena ---- */
var BEANS=[];
function place(cls,S){
  var best=null,bd=-1;
  for(var tries=0;tries<90;tries++){
    var x,y;
    if(cls===0){x=(R()<.5?-1:1)*between(640,1010);y=(R()<.5?-1:1)*between(330,610)}
    else{x=between(-950,950);y=between(-520,520)}
    var ex=x/(cls===0?520:cls===1?560:430),ey=y/(cls===0?260:cls===1?290:230);
    if(ex*ex+ey*ey<1)continue;
    var md=1e9;
    for(var k=0;k<BEANS.length;k++){var b=BEANS[k],d=Math.hypot(b.fx-CX-x,b.fy-CY-y)-(b.S+S)*(cls===0&&b.cls===0?.5:.42);if(d<md)md=d}
    if(md>bd){bd=md;best=[x,y]}
  }
  return best||[between(-900,900),between(-480,480)];
}
function addBean(cls,spr,S,opts){
  var p=place(cls,S);
  BEANS.push({cls:cls,spr:spr,S:S,fx:CX+p[0],fy:CY+p[1],
    d:opts.d,D:opts.D,back:opts.back,dof:opts.dof,mb:opts.mb,
    rot0:between(-3.14,3.14),spin:between(-1,1)*opts.spin,slow:between(-1,1)*.12,
    tumble:opts.tumble,tph:between(0,6.28),tw:between(.5,1.2),
    ax:opts.ax*between(.6,1),ay:opts.ay*between(.6,1),ph1:between(0,6.28),ph2:between(0,6.28),w1:between(.35,.7),w2:between(.3,.65),
    par:opts.par,sa:between(0,6.28),sr:between(8,34),flip:R()<.5?-1:1,dark:opts.dark});
}
function build(){
  var n=SPRITES.length;           /* 0..2 grandes, 3 mediano, resto pequeños */
  var nearIdx=[0,1,2,0],midIdx=[3],small=[];
  for(var i=4;i<n;i++)small.push(i);
  nearIdx.forEach(function(s,k){addBean(0,s,between(400,500),{d:.05+k*.04,D:1.5,back:1.0,dof:between(8,12),mb:16,spin:2.2,tumble:.1,ax:18,ay:14,par:46,dark:1})});
  for(var k=0;k<13;k++){var s=k===0?3:small[k%small.length];addBean(1,s,k===0?between(220,260):between(150,230),{d:between(.06,.4),D:between(1.25,1.7),back:.5,dof:between(1.6,3.4),mb:12,spin:3,tumble:.14,ax:12,ay:10,par:24,dark:.95})}
  for(var k=0;k<30;k++){var s=small[(k*3+2)%small.length];addBean(2,s,between(58,112),{d:between(.12,.6),D:between(1.2,1.8),back:.25,dof:between(.6,1.6),mb:7,spin:4,tumble:.18,ax:8,ay:7,par:10,dark:.88})}
  BEANS.sort(function(a,b){return a.cls===b.cls?0:b.cls-a.cls});
}
function outBack(x,c){var c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2)}

/* ---- dibujo ---- */
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),dpr=1,K=1,OX=0,OY=0,mx=0,my=0,tx=0,ty=0;
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  var w=innerWidth,h=innerHeight;cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  K=Math.min(w/W,h/H)*dpr;OX=(cv.width-W*K)/2;OY=(cv.height-H*K)/2;
}
function frame(t){
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(K,0,0,K,OX,OY);
  mx+=(tx-mx)*.06;my+=(ty-my)*.06;
  BEANS.forEach(function(b){
    var u=Math.max(0,Math.min(1,(t-b.d)/b.D));if(t<b.d)return;
    var e=outBack(u,b.back),es=outBack(u,b.back*.6);
    var a=Math.min(1,u*9);
    var sx0=CX+Math.cos(b.sa)*b.sr,sy0=CY+Math.sin(b.sa)*b.sr;
    var after=Math.max(0,t-b.d-b.D);
    var x=sx0+(b.fx-sx0)*e+Math.sin(after*b.w1+b.ph1)*b.ax*Math.min(1,after*.8)+mx*b.par;
    var y=sy0+(b.fy-sy0)*e+Math.sin(after*b.w2+b.ph2)*b.ay*Math.min(1,after*.8)+my*b.par;
    var sc=.035+.965*Math.max(0,es*es*(3-2*Math.min(1,es))*.0+es);
    var rot=b.rot0+b.spin*(1-Math.pow(1-u,2.2))+b.slow*after;
    var sxs=b.flip*(1-b.tumble*(.5-.5*Math.cos(b.tph+t*b.tw*2)));
    var im=IM[b.spr],ds=b.S*sc/im.width;                 /* escala de pantalla */
    var bs=b.dof*(.3+.7*Math.min(1,sc))+b.mb*Math.pow(1-u,2);   /* desenfoque en px de pantalla */
    var br=bs/Math.max(ds,.05);                            /* en px del sprite */
    var li=0;while(li<LV.length-1&&LV[li+1]<=br)li++;
    var f=li<LV.length-1?(br-LV[li])/(LV[li+1]-LV[li]):0;f=Math.max(0,Math.min(1,f));
    if(br<=LV[0]){li=0;f=0}
    ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.scale(sxs,1);
    var A=blurred(b.spr,li),dwA=(im.width+A.pad*2)*ds,dhA=(im.height+A.pad*2)*ds;
    ctx.globalAlpha=a*(f>0?1-f*.0:1)*(1-f*.0);
    if(b.dark<1){ctx.filter=hasF?'brightness('+b.dark+')':'none'}
    ctx.globalAlpha=a*(1-f);ctx.drawImage(A.c,-dwA/2,-dhA/2,dwA,dhA);
    if(f>0){var B=blurred(b.spr,li+1),dwB=(im.width+B.pad*2)*ds,dhB=(im.height+B.pad*2)*ds;ctx.globalAlpha=a*f;ctx.drawImage(B.c,-dwB/2,-dhB/2,dwB,dhB)}
    ctx.restore();
  });
}
/* ---- tiempo ---- */
var t0=0,fixed=null,raf=0,booted=false,lastDraw=0;
function now(){return fixed!==null?fixed:(performance.now()-t0)/1000}
function loop(){
  var t=now();
  if(reduce)t=9;
  frame(t);
  if(REPLAY_EVERY>0&&t>REPLAY_EVERY&&fixed===null)replay();
  raf=requestAnimationFrame(loop);
}
function replay(){t0=performance.now();mx=my=0}
function boot(){
  if(booted)return;booted=true;build();resize();replay();loop();
  addEventListener('resize',resize);
  addEventListener('pointermove',function(e){tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2});
  addEventListener('pointerdown',replay);
  if('IntersectionObserver' in window){var was=true;new IntersectionObserver(function(es){var v=es[0].isIntersecting;if(v&&!was)replay();was=v}).observe(cv)}
}
window._t=function(s){fixed=s};
})();
</script>
