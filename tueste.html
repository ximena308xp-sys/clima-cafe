:root{--gold:#D6AD65;--cream:#F4DCA6;--body:"Montserrat",system-ui,sans-serif;--display:"Backline","Montserrat",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2a1709;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--body);color:#fff;touch-action:none}
.viewport{position:fixed;inset:0}
.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:radial-gradient(1400px 900px at 30% 40%,#6b3a1b 0%,#4a2610 55%,#2a1709 100%)}

.intro{position:absolute;left:80px;top:320px;width:600px;z-index:5;will-change:transform,opacity}
.intro h3{margin:0 0 18px;font:800 54px/1.05 var(--body);color:var(--gold)}

.intro figure:hover{transform:scale(1.025)}
