}
function drawWin(layers){/* layers: [{i,a}] */
  var s=sc(),w=Math.round(PW*s),h=Math.round(PH*s);
  if(wc.width!==w||wc.height!==h){wc.width=w;wc.height=h}
  if(!(PAPER.naturalWidth&&SHAD.naturalWidth&&PMASK.naturalWidth))return;
  wx.globalCompositeOperation='source-over';wx.clearRect(0,0,w,h);
  wx.drawImage(PAPER,0,0,w,h);
  layers.forEach(function(L){
    var src=paperFor(L.i,s),ar=L.a*PI/180,stp=1;
    for(var dx=0;dx<w;dx+=stp){
      var rel=(PX0+(dx+stp/2)/s)-AX,q=Math.max(-.995,Math.min(.995,rel/R)),ph=Math.asin(q),ps=ph-ar;
      if(ps>=PI/2-.03||ps<=-PI/2+.03)continue;
      var sx=AX+R*Math.sin(ps)-PX0,sw=Math.max(.4,stp/s*Math.cos(ps)/Math.cos(ph));
      if(sx<0||sx+sw>PW)continue;
      wx.globalCompositeOperation='source-over';
      slice(wx,src,s,sx,sw,dx,stp,0,h);
      wx.globalCompositeOperation='source-atop';
      wx.fillStyle='rgba(30,22,6,'+(.5*(1-Math.cos(ph)))+')';wx.fillRect(dx,0,stp,h);
    }
  });
  wx.globalCompositeOperation='destination-in';wx.drawImage(PMASK,0,0,w,h);
  wx.globalCompositeOperation='source-over';wx.drawImage(SHAD,0,0,w,h);
}
var winLayers=[];
function redraw(){paperCache={};drawBase();drawLogo(curLogoA);drawWin(winLayers)}
var curLogoA=0;
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function rest(s){
  if(s===0){wc.style.opacity=0;curLogoA=0;winLayers=[]}else{wc.style.opacity=1;curLogoA=null;winLayers=[{i:s-1,a:0}]}
  drawLogo(curLogoA);drawBase();drawWin(winLayers);
}
function go(n){
  var from=step,to=((n%N)+N)%N,dir=n>from?1:-1;
  cancelAnimationFrame(raf);clearTimeout(timer);var my=++token;step=to;
  if(from!==to){
    var th0=th,t0=performance.now();
    (function f(now){
      if(my!==token)return;
      var t=Math.min(1,(now-t0)/TURN_MS),e=ease(t);
      winLayers=[];
      if(from>0)winLayers.push({i:from-1,a:-dir*ANG*e});
      if(to>0)winLayers.push({i:to-1,a:dir*ANG*(1-e)});
      wc.style.opacity=from===0?e:(to===0?1-e:1);
      curLogoA=from===0?-dir*ANG*e:(to===0?dir*ANG*(1-e):null);
      drawLogo(curLogoA);drawWin(winLayers);
      th=th0-dir*ANG*e*PI/180;drawBase();
      if(t<1)raf=requestAnimationFrame(f);else rest(to);
    })(t0);
  }else rest(to);
  if(AUTO){
    var ms=TURN_MS+(to===0?HOLD_LOGO:BASE_MS+words(TEXTS[to-1])*MS_PER_WORD);
    timer=setTimeout(function(){go(step+1)},ms);
  }
}
document.getElementById('nx').addEventListener('click',function(){go(step+1)});
document.getElementById('pv').addEventListener('click',function(){go(step-1)});
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(step+1);if(e.key==='ArrowLeft')go(step-1)});
var sx0=null;cup.addEventListener('touchstart',function(e){sx0=e.touches[0].clientX},{passive:true});
cup.addEventListener('touchend',function(e){if(sx0===null)return;var d=e.changedTouches[0].clientX-sx0;if(Math.abs(d)>40)go(step+(d<0?1:-1));sx0=null});
window.addEventListener('resize',function(){redraw()});
function start(){rest(0);if(document.fonts&&document.fonts.load){Promise.all([document.fonts.load('600 34px Montserrat'),document.fonts.load('700 34px Montserrat')]).then(function(){paperCache={};drawWin(winLayers)})}timer=setTimeout(function(){go(1)},HOLD_LOGO)}
var started=false;function ok(){if(started)return;if(bodyEl.complete&&LIM.complete&&LIM.naturalWidth){started=true;start()}}
bodyEl.onload=ok;LIM.addEventListener('load',ok);ok();
window._dbg={logo:function(a){AUTO=false;clearTimeout(timer);cancelAnimationFrame(raf);token++;wc.style.opacity=0;drawLogo(a)},go:go,stop:function(){AUTO=false;clearTimeout(timer)}};
})();
</script>
